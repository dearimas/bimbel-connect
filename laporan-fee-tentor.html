<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Bimbingan Belajar Connect - Laporan Fee Tentor
    </title>

    <link
        rel="icon"
        type="image/x-icon"
        href="icon.ico"
    >

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <link
        rel="stylesheet"
        href="assets/css/laporan-fee-tentor.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-section">

        <div class="top-content">


            <div class="brand-row">

                <div class="brand">

                    <img
                        src="icon.ico"
                        alt="Bimbel Connect"
                    >

                    <span>
                        Bimbingan Belajar Connect
                    </span>

                </div>


                <a
                    href="dashboard.html"
                    class="back-button"
                    aria-label="Kembali ke dashboard"
                >
                    ← Kembali
                </a>

            </div>


            <div class="page-heading">

                <div class="heading-icon">
                    👨‍🏫
                </div>


                <div>

                    <h1>
                        Laporan Fee Tentor
                    </h1>

                    <p>
                        Laporan fee dan jam mengajar tentor berdasarkan periode tertentu.
                    </p>

                </div>

            </div>

        </div>

    </header>



    <!-- =========================
         CONTENT
    ========================== -->

    <main class="content">


        <!-- FILTER -->

        <section class="card filter-card">

            <h2 class="card-title">
                Filter Periode
            </h2>


            <form id="filterForm">

                <div class="filter-grid">


                    <div class="field">

                        <label for="tanggalAwal">
                            Tanggal Awal
                        </label>

                        <input
                            type="date"
                            id="tanggalAwal"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="tanggalAkhir">
                            Tanggal Akhir
                        </label>

                        <input
                            type="date"
                            id="tanggalAkhir"
                            required
                        >

                    </div>


                </div>


                <div class="filter-actions">

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Tampilkan Laporan
                    </button>


                    <button
                        type="button"
                        id="resetFilter"
                        class="secondary-btn"
                    >
                        Reset
                    </button>

                </div>

            </form>

        </section>



        <!-- REPORT -->

        <section class="card report-card">


            <div class="report-topbar">

                <div>

                    <h2 class="card-title">
                        Hasil Laporan
                    </h2>

                    <p
                        id="periodeLabel"
                        class="periode-label"
                    >
                        Pilih tanggal untuk menampilkan laporan.
                    </p>
                    
                    <p id="lastUpdateLabel" class="last-update-label">
    Last update: -
</p>

                </div>


                <div class="summary-box">

                    <span>
                        Total Fee Semua Tentor
                    </span>

                    <strong id="totalFeetentor">
                        Rp 0
                    </strong>

                </div>

            </div>


            <!--
                Di sinilah semua card tentor
                akan dibuat oleh JavaScript.
            -->

            <div
                id="reportContainer"
                class="report-container"
            ></div>


        </section>


    </main>



    <script
        src="assets/js/laporan-fee-tentor.js"
    ></script>


</body>

</html>
