<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pembayaran - Bimbel Connect</title>

    <link rel="icon" type="image/x-icon" href="icon.ico">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <link rel="stylesheet" href="assets/css/pembayaran.css">

</head>


<body>


    <!-- =========================
     HEADER
========================= -->

    <header class="header">

        <div class="header-content">

            <div class="topbar">

                <a href="./" class="back-button" aria-label="Kembali">
                    ←
                </a>


                <div class="brand">

                    <img src="icon.ico" alt="Bimbel Connect">

                    <span>
                        Bimbingan Belajar Connect
                    </span>

                </div>

            </div>


            <h1 class="page-title">
                Pembayaran
            </h1>

            <p class="page-subtitle">
                Catat transaksi pembayaran siswa
            </p>

        </div>

    </header>



    <!-- =========================
     CONTENT
========================= -->

    <main class="content">


        <div id="message" class="message"></div>


        <!-- =========================
         DATA PEMBAYARAN
    ========================== -->

        <section class="card">

            <h2 class="card-title">

                <span class="card-title-icon">
                    👨‍🎓
                </span>

                Data Transaksi

            </h2>


            <div class="form-two">

                <div class="field">

                    <label>Kode Pembayaran</label>

                    <input type="text" id="kode" placeholder="Otomatis setelah disimpan" readonly>

                </div>


                <div class="field">

                    <label>
                        Tanggal
                        <span class="required">*</span>
                    </label>

                    <input type="date" id="tanggal" required>

                </div>

            </div>


            <div class="field">

                <label>
                    Jenis Transaksi
                    <span class="required">*</span>
                </label>

                <select id="jenis_transaksi" required>
                    <option value="">Pilih jenis transaksi...</option>
                    <option value="DFT">Pendaftaran</option>
                    <option value="RTG">Pembayaran Reguler</option>
                    <option value="PKT">Pembelian Paket Bimbingan</option>
                </select>

            </div>


            <div class="field">

                <label>
                    Siswa
                    <span class="required">*</span>
                </label>


                <select id="siswa" class="student-select" required>

                    <option value="">
                        Memuat daftar siswa...
                    </option>

                </select>


                <div id="studentInfo" class="student-info">

                    <div id="studentMain" class="student-main"></div>

                    <div id="studentMeta" class="student-meta"></div>

                </div>

            </div>


            <div class="field">

                <label>Catatan</label>

                <textarea id="catatan" placeholder="Catatan tambahan..."></textarea>

            </div>

        </section>



        <!-- =========================
         PEMBAYARAN
    ========================== -->

        <section class="card">

            <h2 class="card-title">

                <span class="card-title-icon">
                    💳
                </span>

                Pembayaran

            </h2>


            <div class="field">

                <label>
                    Total Bayar
                    <span class="required">*</span>
                </label>

                <input type="text" id="total_bayar" inputmode="numeric" placeholder="Rp 0" required>

            </div>


            <div class="payment-box cash full-width">

                <div class="field">

                    <label>Tunai</label>

                    <input type="text" id="tunai_baru" inputmode="numeric" placeholder="Rp 0">

                </div>

            </div>


            <div class="payment-box non-cash full-width">

                <div class="non-cash-row">

                    <div class="field">

                        <label>Non Tunai</label>

                        <select id="non_tunai_tipe">
                            <option value="">Pilih metode non tunai...</option>
                            <option value="transfer">Transfer</option>
                            <option value="qris">QRIS</option>
                            <option value="voucher">Voucher</option>
                        </select>

                    </div>


                    <div class="field">

                        <label>Nominal Non Tunai</label>

                        <input type="text" id="non_tunai_nominal" inputmode="numeric" placeholder="Rp 0">

                    </div>


                    <div class="field">

                        <label id="nonTunaiKeteranganLabel">
                            Bank / Nomor Voucher
                        </label>

                        <input type="text" id="non_tunai_keterangan"
                            placeholder="Pilih metode non tunai terlebih dahulu">

                    </div>

                </div>

            </div>


            <div class="payment-grid legacy-payment-fields">


                <!-- TUNAI -->

                <div class="payment-box cash">

                    <label>
                        Tunai
                    </label>

                    <input type="number" id="tunai" min="0" step="1000" placeholder="Rp 0">

                </div>


                <!-- TRANSFER -->

                <div class="payment-box transfer">

                    <label>
                        Transfer
                    </label>

                    <input type="number" id="transfer" min="0" step="1000" placeholder="Rp 0">

                </div>


                <!-- QRIS -->

                <div class="payment-box qris">

                    <label>
                        QRIS
                    </label>

                    <input type="number" id="qris" min="0" step="1000" placeholder="Rp 0">

                </div>


                <!-- VOUCHER -->

                <div class="payment-box voucher">

                    <label>
                        Voucher
                    </label>

                    <input type="number" id="voucher" min="0" step="1000" placeholder="Rp 0">

                </div>

            </div>


            <!-- TOTAL -->

            <div class="total-box legacy-payment-fields">

                <div class="total-row">

                    <div>

                        <div class="total-label">
                            Total pembayaran
                        </div>

                        <div id="totalDisplay" class="total-value">
                            Rp 0
                        </div>

                    </div>

                    <div style="font-size:28px;">
                        💰
                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
         DETAIL PEMBAYARAN
    ========================== -->

        <section class="card">

            <h2 class="card-title">

                <span class="card-title-icon">
                    📝
                </span>

                Detail

            </h2>


            <div class="field legacy-payment-detail">

                <label>
                    Bank Transfer
                </label>

                <input type="text" id="transfer_bank" placeholder="Contoh: BCA / BRI / Mandiri">

            </div>


            <div class="field legacy-payment-detail">

                <label>
                    Keterangan Voucher
                </label>

                <input type="text" id="voucher_keterangan" placeholder="Keterangan voucher (jika ada)">

            </div>


            <div class="field">

                <label>
                    Uang Kembali
                </label>

                <input type="text" id="uang_kembali" inputmode="numeric" placeholder="Rp 0" readonly>

            </div>


            <div class="field legacy-payment-detail">

                <label>
                    Catatan
                </label>

                <textarea id="catatan_lama" placeholder="Catatan tambahan..."></textarea>

            </div>

        </section>



        <!-- =========================
         SIMPAN
    ========================== -->

        <section class="card">

            <button id="saveButton" class="save-button">
                💾 Simpan Pembayaran
            </button>


            <button id="cancelButton" class="cancel-button">
                Batal
            </button>

        </section>


    </main>



    <script src="assets/js/pembayaran.js"></script>
</body>

</html>
