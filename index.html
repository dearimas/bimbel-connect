<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bimbingan Belajar CONNECT</title>

    <link rel="icon" type="image/x-icon" href="icon.ico">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

        <link rel="stylesheet" href="assets/css/index.css">
</head>

<body>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>
    <div class="shape shape-four"></div>

    <main class="page">

        <div class="login-container">

            <!-- Welcome -->
            <section class="welcome-panel">

                <div class="welcome-content">

                    <img
                        src="icon.ico"
                        alt="Logo Bimbel Connect"
                        class="logo-large"
                    >

                    <h1>Bimbel Connect</h1>

                    <p class="tagline">
                        Teman belajar, tumbuh, dan meraih prestasi
                        bersama dari TK hingga SMA.
                    </p>

                    <div class="education-tags">
                        <div class="education-tag">🌱 TK</div>
                        <div class="education-tag">📚 SD</div>
                        <div class="education-tag">🚀 SMP</div>
                        <div class="education-tag">🎓 SMA</div>
                    </div>

                </div>

            </section>


            <!-- Login -->
            <section class="login-panel">

                <div class="login-box">

                    <div class="login-heading">

                        <div class="small-title">
                            Selamat datang kembali
                        </div>

                        <h2>Masuk ke akun</h2>

                        <p>
                            Silakan login untuk mengakses
                            Bimbel Connect.
                        </p>

                    </div>


                    <form id="loginForm">

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">✉️</span>

                                <input
                                    type="email"
                                    id="email"
                                    placeholder="nama@email.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">🔒</span>

                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Masukkan password"
                                    autocomplete="current-password"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="login-button"
                            id="loginButton"
                        >
                            Masuk
                        </button>

                    </form>


                    <div id="message"></div>


                    <div class="footer-text">
                        Bimbel Connect <span>♥</span>
                        · Belajar lebih terhubung
                    </div>

                </div>

            </section>

        </div>

    </main>


        <script src="assets/js/index.js"></script>
</body>
</html>
