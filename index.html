<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bimbingan Belajar CONNECT</title>

    <link rel="icon" type="image/x-icon" href="icon.ico">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --blue: #4f7cff;
            --purple: #8b5cf6;
            --yellow: #ffc857;
            --pink: #ff6fae;
            --green: #42c98a;
            --dark: #26324a;
            --muted: #74809a;
            --white: #ffffff;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family:
                "Segoe UI",
                Arial,
                sans-serif;
            color: var(--dark);
            background:
                linear-gradient(
                    135deg,
                    #eef5ff 0%,
                    #f8f1ff 50%,
                    #fff8e9 100%
                );
            overflow-x: hidden;
        }

        /* Decorative shapes */

        .shape {
            position: fixed;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        .shape-one {
            width: 260px;
            height: 260px;
            background: rgba(79, 124, 255, 0.15);
            top: -100px;
            left: -80px;
        }

        .shape-two {
            width: 220px;
            height: 220px;
            background: rgba(255, 200, 87, 0.18);
            right: -70px;
            top: 100px;
        }

        .shape-three {
            width: 280px;
            height: 280px;
            background: rgba(139, 92, 246, 0.12);
            bottom: -130px;
            left: 10%;
        }

        .shape-four {
            width: 170px;
            height: 170px;
            background: rgba(255, 111, 174, 0.13);
            right: 12%;
            bottom: -70px;
        }

        /* Main layout */

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 18px;
        }

        .login-container {
            width: 100%;
            max-width: 1050px;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            box-shadow:
                0 25px 70px rgba(57, 72, 115, 0.16);
            overflow: hidden;
            backdrop-filter: blur(14px);
        }

        /* Left panel */

        .welcome-panel {
            position: relative;
            min-height: 620px;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            background:
                linear-gradient(
                    145deg,
                    #4f7cff 0%,
                    #705cf5 48%,
                    #9b5de5 100%
                );
            color: white;
        }

        .welcome-panel::before {
            content: "";
            position: absolute;
            width: 330px;
            height: 330px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -140px;
            right: -100px;
        }

        .welcome-panel::after {
            content: "";
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: rgba(255,200,87,0.16);
            bottom: -110px;
            left: -80px;
        }

        .welcome-content {
            position: relative;
            z-index: 2;
        }

        .logo-large {
            width: 112px;
            height: 112px;
            object-fit: contain;
            background: white;
            padding: 12px;
            border-radius: 28px;
            box-shadow:
                0 15px 35px rgba(20, 32, 75, 0.18);
            margin-bottom: 28px;
        }

        .welcome-panel h1 {
            margin: 0 0 12px;
            font-size: clamp(34px, 4vw, 52px);
            line-height: 1.05;
            letter-spacing: -1.5px;
        }

        .welcome-panel .tagline {
            margin: 0;
            max-width: 470px;
            font-size: 19px;
            line-height: 1.6;
            color: rgba(255,255,255,0.9);
        }

        .education-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 30px;
        }

        .education-tag {
            padding: 9px 15px;
            border-radius: 999px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        .education-tag:nth-child(2) {
            background: rgba(255,200,87,0.22);
        }

        .education-tag:nth-child(3) {
            background: rgba(66,201,138,0.20);
        }

        .education-tag:nth-child(4) {
            background: rgba(255,111,174,0.20);
        }

        /* Login panel */

        .login-panel {
            padding: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.95);
        }

        .login-box {
            width: 100%;
            max-width: 380px;
        }

        .login-heading {
            margin-bottom: 30px;
        }

        .login-heading .small-title {
            color: var(--blue);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 8px;
        }

        .login-heading h2 {
            margin: 0;
            font-size: 32px;
            letter-spacing: -0.7px;
        }

        .login-heading p {
            margin: 9px 0 0;
            color: var(--muted);
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--dark);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0.7;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 15px 0 46px;
            border: 1.5px solid #e0e5ef;
            border-radius: 13px;
            background: #fbfcff;
            color: var(--dark);
            font-size: 15px;
            outline: none;
            transition: 0.2s ease;
        }

        input:focus {
            border-color: var(--blue);
            background: white;
            box-shadow:
                0 0 0 4px rgba(79,124,255,0.10);
        }

        input::placeholder {
            color: #a4adbd;
        }

        .login-button {
            width: 100%;
            height: 54px;
            margin-top: 4px;
            border: none;
            border-radius: 14px;
            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow:
                0 10px 24px rgba(79,124,255,0.25);
            transition: 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow:
                0 14px 28px rgba(79,124,255,0.30);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        #message {
            min-height: 22px;
            margin-top: 16px;
            padding: 0 5px;
            text-align: center;
            font-size: 14px;
            line-height: 1.5;
        }

        .footer-text {
            margin-top: 28px;
            text-align: center;
            color: #9aa3b3;
            font-size: 12px;
        }

        .footer-text span {
            color: var(--pink);
        }

        /* Mobile */

        @media (max-width: 800px) {

            .page {
                padding: 18px;
            }

            .login-container {
                grid-template-columns: 1fr;
                max-width: 480px;
                border-radius: 22px;
            }

            .welcome-panel {
                min-height: auto;
                padding: 35px 30px;
                text-align: center;
            }

            .welcome-content {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .logo-large {
                width: 88px;
                height: 88px;
                border-radius: 22px;
                margin-bottom: 20px;
            }

            .welcome-panel h1 {
                font-size: 36px;
            }

            .welcome-panel .tagline {
                font-size: 16px;
            }

            .education-tags {
                justify-content: center;
                margin-top: 22px;
            }

            .login-panel {
                padding: 35px 28px 40px;
            }

            .login-heading h2 {
                font-size: 28px;
            }
        }

        @media (max-width: 380px) {

            .welcome-panel {
                padding: 30px 20px;
            }

            .login-panel {
                padding: 30px 20px 35px;
            }

            .education-tag {
                font-size: 12px;
                padding: 8px 11px;
            }
        }
    </style>
</head>

<body>

    <div class="shape shape-one"></div>
    <div class="shape shape-two"></div>
    <div class="shape shape-three"></div>
    <div class="shape shape-four"></div>

    <main class="page">

        <div class="login-container">

            <!-- Welcome -->
            <section class="welcome-panel">

                <div class="welcome-content">

                    <img
                        src="icon.ico"
                        alt="Logo Bimbel Connect"
                        class="logo-large"
                    >

                    <h1>Bimbel Connect</h1>

                    <p class="tagline">
                        Teman belajar, tumbuh, dan meraih prestasi
                        bersama dari TK hingga SMA.
                    </p>

                    <div class="education-tags">
                        <div class="education-tag">🌱 TK</div>
                        <div class="education-tag">📚 SD</div>
                        <div class="education-tag">🚀 SMP</div>
                        <div class="education-tag">🎓 SMA</div>
                    </div>

                </div>

            </section>


            <!-- Login -->
            <section class="login-panel">

                <div class="login-box">

                    <div class="login-heading">

                        <div class="small-title">
                            Selamat datang kembali
                        </div>

                        <h2>Masuk ke akun</h2>

                        <p>
                            Silakan login untuk mengakses
                            Bimbel Connect.
                        </p>

                    </div>


                    <form id="loginForm">

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">✉️</span>

                                <input
                                    type="email"
                                    id="email"
                                    placeholder="nama@email.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>


                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">🔒</span>

                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Masukkan password"
                                    autocomplete="current-password"
                                    required
                                >

                            </div>

                        </div>


                        <button
                            type="submit"
                            class="login-button"
                            id="loginButton"
                        >
                            Masuk
                        </button>

                    </form>


                    <div id="message"></div>


                    <div class="footer-text">
                        Bimbel Connect <span>♥</span>
                        · Belajar lebih terhubung
                    </div>

                </div>

            </section>

        </div>

    </main>


    <script>

        const SUPABASE_URL =
            "https://ipnoshuvofomxwssamma.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_Q95e9ofqnDyPhavmx8GLSA_Dr3rnuj5";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        // Cek apakah user sudah login
        async function checkSession() {

            const {
                data: { session }
            } = await supabaseClient.auth.getSession();

            if (session) {

                window.location.href =
                    "dashboard.html";

            }
        }


        checkSession();


        // Proses login
        document
            .getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event) {

                    event.preventDefault();

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("password")
                            .value;

                    const button =
                        document
                            .getElementById("loginButton");

                    const message =
                        document
                            .getElementById("message");


                    button.disabled = true;
                    button.textContent = "Memproses...";
                    message.textContent = "";


                    const {
                        data,
                        error
                    } =
                        await supabaseClient.auth
                            .signInWithPassword({
                                email: email,
                                password: password
                            });


                    if (error) {

                        message.textContent =
                            "Login gagal. Periksa email dan password.";

                        message.style.color =
                            "#e05252";

                        button.disabled = false;
                        button.textContent = "Masuk";

                        return;
                    }


                    message.textContent =
                        "Login berhasil. Membuka aplikasi...";

                    message.style.color =
                        "#42a878";


                    window.location.href =
                        "dashboard.html";

                }
            );

    </script>

</body>
</html>
